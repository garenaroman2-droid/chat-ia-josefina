<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Josefina IA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111b21;
      height: 100vh;
    }

    .app {
      max-width: 600px;
      height: 100vh;
      margin: auto;
      background: #0b141a;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 65px;
      background: #202c33;
      color: white;
      display: flex;
      align-items: center;
      padding: 10px 15px;
      gap: 12px;
    }

    .avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #d8a07c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      color: #aebac1;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      background: #0b141a;
    }

    .message {
      max-width: 80%;
      padding: 9px 12px;
      margin-bottom: 8px;
      border-radius: 9px;
      color: white;
      font-size: 15px;
      line-height: 1.4;
    }

    .received {
      background: #202c33;
      margin-right: auto;
    }

    .sent {
      background: #005c4b;
      margin-left: auto;
    }

    .typing {
      color: #8696a0;
      font-size: 13px;
      display: none;
      margin: 5px 10px;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 8px;
      background: #202c33;
    }

    input {
      flex: 1;
      border: none;
      outline: none;
      border-radius: 20px;
      padding: 12px 15px;
      font-size: 15px;
      background: #2a3942;
      color: white;
    }

    button {
      width: 48px;
      height: 48px;
      border: none;
      border-radius: 50%;
      background: #00a884;
      color: white;
      font-size: 20px;
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="avatar">👩🏻</div>

    <div>
      <div class="name">Josefina</div>
      <div class="status">en línea</div>
    </div>
  </div>

  <div class="chat" id="chat">

    <div class="message received">
      Holaa 😌 ¿cómo estás?
    </div>

  </div>

  <div class="typing" id="typing">
    Josefina está escribiendo...
  </div>

  <div class="input-area">

    <input
      id="messageInput"
      type="text"
      placeholder="Escribí un mensaje..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">➤</button>

  </div>

</div>

<script>

  const input = document.getElementById("messageInput");
  const chat = document.getElementById("chat");
  const typing = document.getElementById("typing");

  input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
      sendMessage();
    }
  });

  function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    message.textContent = text;

    chat.appendChild(message);

    chat.scrollTop = chat.scrollHeight;
  }

  async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "sent");

  input.value = "";

  typing.style.display = "block";

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        message: text
      })
    });

    const data = await response.json();

    typing.style.display = "none";

    if (data.reply) {
      addMessage(data.reply, "received");
    } else {
      addMessage("No pude responder ahora 😕", "received");
    }

  } catch (error) {
    typing.style.display = "none";

    addMessage(
      "Uy, tuve un problema para responder 😕",
      "received"
    );

    console.error(error);
  }
}

</script>

</body>
</html>
